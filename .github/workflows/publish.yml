name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build
        run: uv build

      - name: Check sdist contents
        run: |
          SDIST=$(ls dist/*.tar.gz)
          UNEXPECTED=$(tar -tzf "$SDIST" | sed 's|^[^/]*/||' | grep -Ev '^src/puxti/|^$|^(pyproject\.toml|LICENSE|NOTICE\.md|README\.md|SECURITY\.md|TELEMETRY\.md|\.env\.example|\.gitignore|PKG-INFO)$')
          if [ -n "$UNEXPECTED" ]; then
            echo "ERROR: unexpected files in sdist:"
            echo "$UNEXPECTED" | sed 's/^/  /'
            exit 1
          fi
          echo "sdist clean: $(basename $SDIST)"

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
