name: Publish

on:
  push:
    tags:
      - "pypi/v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv run twine upload --username __token__ --password ${{ secrets.PYPI_API_TOKEN }} dist/*
