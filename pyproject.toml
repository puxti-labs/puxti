[project]
name = "puxti"
version = "0.10.0"
description = "Open-source CLI for safe schema and semantic change propagation across dbt projects."
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiosqlite>=0.20.0",
    "anthropic>=0.30.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0.0",
    "posthog>=3.0.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/puxti-labs/puxti"
Repository = "https://github.com/puxti-labs/puxti"
Documentation = "https://github.com/puxti-labs/puxti#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.5.0",
    "twine>=5.0.0",
]

[project.scripts]
puxti = "puxti.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/puxti"]

[tool.hatch.build.targets.sdist]
exclude = [
  "tests", "assets",
  "Makefile",
  "uv.lock",
  ".github", ".gitignore", ".python-version",
  "fix_plan.md",
  "AGENTS.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "docs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
