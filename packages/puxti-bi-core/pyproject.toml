[project]
name = "puxti-bi-core"
version = "0.20.0"
description = "BI assets as code: the spec schema for datasets, charts and dashboards used by Puxti."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/puxti-labs/puxti"
Repository = "https://github.com/puxti-labs/puxti"
Documentation = "https://github.com/puxti-labs/puxti/blob/main/docs/bi-specs.md"

[tool.hatch.build.targets.wheel]
packages = ["src/puxti_bi_core"]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
